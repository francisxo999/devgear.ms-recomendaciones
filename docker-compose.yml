services:
  db-recomendaciones:
    image: mysql:8.0
    container_name: mysql-recomendaciones
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: recomendaciones_db
    ports:
      - "3311:3306"
    volumes:
      - db_recomendaciones_data:/var/lib/mysql

  app-recomendaciones:
    build: .
    container_name: devgear-ms-recomendaciones-1
    restart: always
    ports:
      - "8087:8087"
    depends_on:
      - db-recomendaciones
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db-recomendaciones:3306/recomendaciones_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-host.docker.internal:9092}
      PRODUCTOS_API_BASE_URL: ${PRODUCTOS_API_BASE_URL:-http://host.docker.internal:8081}

volumes:
  db_recomendaciones_data:
